<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hybrid PPL Program</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f4f4f5;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{max-width:960px;margin:auto;padding:16px}.top{position:sticky;top:0;background:rgba(10,10,10,.94);backdrop-filter:blur(12px);padding:12px 0;z-index:5}.title{font-size:22px;font-weight:750;margin-bottom:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ctrl label{display:block;color:#a1a1aa;font-size:12px;margin-bottom:6px}select{width:100%;min-height:46px;border:1px solid #333;background:#161616;color:white;border-radius:12px;padding:0 12px;font-size:16px}.card{border:1px solid #2a2a2a;background:#111;border-radius:14px;margin-top:14px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #252525}.focus{color:#a1a1aa;font-size:13px;margin-top:4px}.hint{font-size:12px;color:#858585;padding:8px 12px 0}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}.tbl{width:820px;min-width:820px;border-collapse:collapse}.tbl th,.tbl td{padding:12px 14px;text-align:left;border-bottom:1px solid #222;vertical-align:top}.tbl th{font-size:12px;color:#999;background:#151515}.tbl td:first-child{font-weight:650;width:230px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.rule{border:1px solid #292929;background:#111;border-radius:12px;padding:12px}.rule b{display:block;font-size:12px;color:#8f8f8f;margin-bottom:4px}.footer{color:#777;font-size:12px;padding:18px 2px 30px}.err{display:none;border:1px solid #5b2b2b;background:#211;color:#f8caca;border-radius:12px;padding:12px;margin-top:12px}@media(max-width:600px){.wrap{padding:12px}.controls,.rules{grid-template-columns:1fr}.title{font-size:20px}}
</style></head><body><div class="wrap"><div class="top"><div class="title">Hybrid PPL — Current Working Program</div><div class="controls"><div class="ctrl"><label>Cycle week</label><select id="week"></select></div><div class="ctrl"><label>Training day</label><select id="day"></select></div></div><div class="err" id="err"></div></div><div class="card"><div class="head"><b id="session">Loading…</b><div class="focus" id="focus"></div></div><div class="hint">↔ Swipe horizontally for all columns</div><div class="scroll"><table class="tbl"><thead><tr><th>Exercise</th><th>Sets × reps</th><th>Role</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="rules" id="rules"></div><div class="footer">Live working skeleton · future program revisions can be published to this same app.</div></div><script>
const endpoint='https://qmgzmbnxkepesuntinfo.supabase.co/functions/v1/training-program';
const $=id=>document.getElementById(id);const w=$('week'),d=$('day'),rows=$('rows'),session=$('session'),focus=$('focus'),rules=$('rules'),err=$('err');
let data;
function loadDays(){d.innerHTML='';Object.keys(data.weeks[w.value]).forEach(x=>d.add(new Option(x,x)));render()}
function render(){session.textContent=d.value;focus.textContent=d.value.includes('Strength')?'Strength-dominant session with hypertrophy support.':'Power/skill-dominant session with supplementary strength and hypertrophy.';rows.innerHTML=data.weeks[w.value][d.value].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')}
async function init(){try{const res=await fetch(endpoint,{cache:'no-store'});const txt=await res.text();const m=txt.match(/const data = (\{[\s\S]*?\n\};)/);if(!m) throw new Error('Live program source format changed.');data=(new Function('return '+m[1].slice(0,-1)))();data.weeks['Week 2']=JSON.parse(JSON.stringify(data.weeks['Week 1']));data.weeks['Week 2']['Push A — Strength'][0]=['Overhead Press','1×1 @ RPE 7–8 + 3×3–5','Primary press strength'];data.weeks['Week 2']['Push A — Strength'][1]=['Bench Press','3×4–6','Secondary press strength'];data.weeks['Week 2']['Push B — Power / Skill'][4]=['Concentric-only / Dynamic OHP','4×2–4','Supplementary OHP strength'];data.weeks['Week 2']['Legs A — Strength'][0]=['Bulgarian Split Squat','4×4–6 / leg','Primary unilateral strength'];data.weeks['Week 2']['Legs A — Strength'][1]=['Trap-Bar Deadlift','3×3–5','Secondary bilateral strength'];Object.keys(data.weeks).forEach(x=>w.add(new Option(x,x)));Object.entries(data.rules).forEach(([k,v])=>{const e=document.createElement('div');e.className='rule';e.innerHTML='<b>'+k.replaceAll('_',' ').toUpperCase()+'</b>'+v;rules.appendChild(e)});w.onchange=loadDays;d.onchange=render;loadDays()}catch(e){err.style.display='block';err.textContent='Could not load the live program: '+e.message;session.textContent='Program unavailable';}}
init();
</script></body></html>
